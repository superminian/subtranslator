<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>SubTranslator · 监控台</title>
    <script>
        (() => {
            const savedTheme = localStorage.getItem('subtranslatorTheme');
            const theme = savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
</head>
<body data-admin-token-required="{{ admin_token_required | tojson }}">
    <svg class="icon-sprite" aria-hidden="true">
        <symbol id="icon-subtitles" viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="M7 11h4M7 15h6M15 11h2M15 15h2"></path>
        </symbol>
        <symbol id="icon-check" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="m8 12 2.5 2.5L16 9"></path>
        </symbol>
        <symbol id="icon-alert" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 8v5M12 16.5h.01"></path>
        </symbol>
        <symbol id="icon-loader" viewBox="0 0 24 24">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
        </symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 7v5l3 2"></path>
        </symbol>
        <symbol id="icon-list" viewBox="0 0 24 24">
            <path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"></path>
        </symbol>
        <symbol id="icon-text" viewBox="0 0 24 24">
            <path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"></path>
        </symbol>
        <symbol id="icon-terminal" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <path d="m7 9 3 3-3 3M13 15h4"></path>
        </symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
        </symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24">
            <path d="M20 15.4A8.5 8.5 0 0 1 8.6 4a8.5 8.5 0 1 0 11.4 11.4Z"></path>
        </symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.6-1H3v-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.6 1h.09v4H21a1.7 1.7 0 0 0-1.6 1Z"></path>
        </symbol>
        <symbol id="icon-close" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18"></path>
        </symbol>
        <symbol id="icon-inbox" viewBox="0 0 24 24">
            <path d="M4 5h16l2 9v5H2v-5l2-9Z"></path>
            <path d="M2 14h5l2 3h6l2-3h5"></path>
        </symbol>
    </svg>

    <div class="app-shell">
        <header class="app-header">
            <a class="brand" href="/" aria-label="SubTranslator 首页">
                <span class="brand-mark"><svg><use href="#icon-subtitles"></use></svg></span>
                <span>
                    <strong>SubTranslator</strong>
                    <small>实时字幕翻译监控</small>
                </span>
            </a>
            <div class="header-actions">
                <div class="connection-state" id="connection-state" data-state="checking" role="status" aria-live="polite">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span id="connection-label">正在连接</span>
                </div>
                <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="切换深色主题" title="切换主题">
                    <svg class="theme-icon theme-icon-sun"><use href="#icon-sun"></use></svg>
                    <svg class="theme-icon theme-icon-moon"><use href="#icon-moon"></use></svg>
                </button>
                <button class="icon-button" id="config-button" type="button" aria-label="打开配置" title="配置">
                    <svg><use href="#icon-settings"></use></svg>
                </button>
            </div>
        </header>

        <main class="dashboard">
            <section class="stats-grid" aria-label="运行概览">
                <article class="stat-card" data-tone="success">
                    <div class="stat-heading"><span class="stat-icon"><svg><use href="#icon-check"></use></svg></span><span>翻译成功</span></div>
                    <strong class="stat-value" id="stat-success">0</strong>
                    <span class="stat-caption">累计完成文件</span>
                </article>
                <article class="stat-card" data-tone="danger">
                    <div class="stat-heading"><span class="stat-icon"><svg><use href="#icon-alert"></use></svg></span><span>翻译失败</span></div>
                    <strong class="stat-value" id="stat-failed">0</strong>
                    <span class="stat-caption">需要检查任务</span>
                </article>
                <article class="stat-card" data-tone="primary">
                    <div class="stat-heading"><span class="stat-icon"><svg><use href="#icon-loader"></use></svg></span><span>正在处理</span></div>
                    <strong class="stat-value" id="stat-progress">0</strong>
                    <span class="stat-caption">当前活动任务</span>
                </article>
                <article class="stat-card" data-tone="neutral">
                    <div class="stat-heading"><span class="stat-icon"><svg><use href="#icon-clock"></use></svg></span><span>运行时长</span></div>
                    <strong class="stat-value stat-value-time" id="stat-uptime">0h 0m</strong>
                    <span class="stat-caption">本次服务周期</span>
                </article>
            </section>

            <div class="dashboard-grid">
                <section class="panel tasks-panel">
                    <div class="panel-header">
                        <div>
                            <div class="panel-title"><svg><use href="#icon-list"></use></svg><h2>任务队列</h2></div>
                            <p>当前字幕文件的翻译进度</p>
                        </div>
                        <span class="panel-meta">实时更新</span>
                    </div>
                    <div class="panel-content" id="translation-progress-list" aria-live="polite">
                        <div class="empty-state"><span class="loading-spinner" aria-hidden="true"></span><p>正在加载任务</p></div>
                    </div>
                </section>

                <section class="panel content-panel">
                    <div class="panel-header">
                        <div>
                            <div class="panel-title"><svg><use href="#icon-text"></use></svg><h2>翻译内容</h2></div>
                            <p>最近生成的字幕对照</p>
                        </div>
                        <span class="panel-meta">最新优先</span>
                    </div>
                    <div class="panel-content" id="translation-content-list" aria-live="polite">
                        <div class="empty-state"><span class="loading-spinner" aria-hidden="true"></span><p>正在加载内容</p></div>
                    </div>
                </section>

                <section class="panel logs-panel">
                    <div class="panel-header">
                        <div>
                            <div class="panel-title"><svg><use href="#icon-terminal"></use></svg><h2>系统日志</h2></div>
                            <p>服务运行与错误信息</p>
                        </div>
                        <span class="panel-meta">最近 200 条</span>
                    </div>
                    <div class="panel-content log-list" id="log-list" aria-live="polite">
                        <div class="empty-state"><span class="loading-spinner" aria-hidden="true"></span><p>正在加载日志</p></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div class="modal" id="config-modal" role="dialog" aria-modal="true" aria-labelledby="config-title" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="config-title">配置管理</h2>
                    <p>保存后需重启容器才能生效</p>
                </div>
                <button class="icon-button close-button" id="close-config-button" type="button" aria-label="关闭配置">
                    <svg><use href="#icon-close"></use></svg>
                </button>
            </div>
            <div id="config-alert" class="alert" role="status" aria-live="polite"></div>
            <form class="config-form" id="config-form">
                <div class="form-group form-group-wide">
                    <label for="api-key">API Key <span aria-hidden="true">*</span></label>
                    <input type="password" name="API_KEY" id="api-key" placeholder="sk-..." autocomplete="off">
                    <small>DeepSeek 或 OpenAI API 密钥；留空则保留现有密钥</small>
                </div>
                <div class="form-group form-group-wide">
                    <label for="proxy-url">API 端点</label>
                    <input type="url" name="PROXY_URL" id="proxy-url" placeholder="https://api.deepseek.com/v1/chat/completions">
                    <small>填写与所选模型对应的兼容 API 地址</small>
                </div>
                <div class="form-group">
                    <label for="model">模型</label>
                    <select name="MODEL" id="model">
                        <option value="deepseek-chat">deepseek-chat</option>
                        <option value="gpt-4o-mini">gpt-4o-mini</option>
                        <option value="gpt-4o">gpt-4o</option>
                        <option value="gpt-4-turbo">gpt-4-turbo</option>
                        <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="max-workers">最大并发数</label>
                    <input type="number" name="MAX_WORKERS" id="max-workers" value="10" min="1" max="50">
                </div>
                <div class="form-group form-group-wide">
                    <label for="movies-dir">电影目录</label>
                    <input type="text" name="MOVIES_DIR" id="movies-dir" placeholder="/mnt/user/media/media/movies">
                </div>
                <div class="form-group form-group-wide">
                    <label for="tv-dir">电视剧目录</label>
                    <input type="text" name="TV_DIR" id="tv-dir" placeholder="/mnt/user/media/media/tv">
                </div>
                <div class="form-group form-group-wide">
                    <label for="custom-dirs">自定义监控目录</label>
                    <input type="text" name="CUSTOM_DIRS" id="custom-dirs" placeholder="/path1,/path2">
                    <small>多个目录用英文逗号分隔</small>
                </div>
                <div class="form-group">
                    <label for="log-level">日志级别</label>
                    <select name="LOG_LEVEL" id="log-level">
                        <option value="DEBUG">DEBUG</option>
                        <option value="INFO" selected>INFO</option>
                        <option value="WARNING">WARNING</option>
                        <option value="ERROR">ERROR</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="button" class="button button-secondary" id="cancel-config-button">取消</button>
                    <button type="submit" class="button button-primary">保存配置</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
